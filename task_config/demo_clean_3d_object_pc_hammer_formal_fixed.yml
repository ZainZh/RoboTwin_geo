# Beat Block Hammer paper evaluation: standard asset and exact fixed candidates.
render_freq: 0
episode_num: 100
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: Large_L515
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: false
data_type:
  rgb: true
  third_view: true
  depth: false
  pointcloud: true
  combine: true
  object_pointcloud: true
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
object_pointcloud:
  combine: true
  point_num: 1024
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: false

# Reusing the canonical asset through the custom-eval route disables the
# expensive expert screening without changing hammer geometry or spawn pose.
custom_hammer_eval:
  enabled: true
  modelname: 020_hammer
  model_id: [0]
  spawn_pose_mode: match_reference_contact

# Under this protocol test_num is a candidate budget, not an accepted-seed
# budget. Thus --seed 0 --test_num 100 always means seeds 100000..100099.
fixed_seed_protocol:
  enabled: true
