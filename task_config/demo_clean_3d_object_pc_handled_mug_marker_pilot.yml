render_freq: 0
episode_num: 100
initial_seed: 141
use_seed: false
save_freq: 60
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: Large_L515
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: false
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  combine: false
  object_pointcloud: true
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
object_pointcloud:
  combine: true
  point_num: 1024
  targets:
    "{A}": container
    "{B}": target_block
handle_marker:
  # Use one direct mug grasp, then vary only the functional
  # target.  This keeps grasp-planning failures out of the representation test.
  fixed_arm: right
  initial_yaw_limit_deg: 0.0
  support_half_length: 0.12
  support_half_width: 0.10
  marker_x_limit: 0.035
  marker_y_limit: 0.025
  marker_yaw_limit_deg: 45.0
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
