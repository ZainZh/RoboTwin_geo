defaults:
  - task: demo_task_objpc

name: dp3_objpc

task_name: null
shape_meta: ${task.shape_meta}
exp_name: "debug"

horizon: 8
n_obs_steps: 3
n_action_steps: 6
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy_3d.policy.dp3.DP3
  use_point_crop: true
  condition_type: film
  use_down_condition: true
  use_mid_condition: true
  use_up_condition: true

  diffusion_step_embed_dim: 64
  down_dims:
  - 512
  - 1024
  - 2048
  crop_shape:
  - 80
  - 80
  encoder_output_dim: 128
  horizon: ${horizon}
  kernel_size: 5
  n_action_steps: ${n_action_steps}
  n_groups: 8
  n_obs_steps: ${n_obs_steps}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: sample

  num_inference_steps: 10
  obs_as_global_cond: true
  shape_meta: ${shape_meta}

  use_pc_color: false
  pointnet_type: "pointnet"

  # Optional safe geometry route. When enabled, geometry is excluded from the
  # base observation encoder and added through a zero-initialized adapter.
  geometry_key: null
  geometry_confidence_key: null
  geometry_encoder_output_dim: 64
  geometry_dropout: 0.0
  geometry_force_zero: false
  global_geometry_key: null
  global_geometry_confidence_key: null
  global_geometry_hidden_dim: 64
  global_geometry_dropout: 0.0
  global_geometry_force_zero: false

  # GAP-style label-only future geometry prediction. The selected observation
  # is removed from policy conditioning and used only as an auxiliary target.
  aux_geometry_key: null
  aux_geometry_loss_weight: 0.0
  aux_geometry_hidden_dim: 256
  aux_geometry_target_mode: endpoint_displacement

  # Optional learned hybrid-action route. Cartesian motion remains diffusion;
  # binary gripper commands use a geometry-conditioned classification head.
  binary_gripper_indices: []
  binary_gripper_hidden_dim: 128
  binary_gripper_loss_weight: 0.0
  binary_gripper_positive_weight: 3.0
  # Closed-state hold/release has a different class balance from grasping.
  # Null preserves the main-head weight; terminal-release training uses 1.0.
  binary_gripper_retention_positive_weight: null
  binary_gripper_threshold: 0.5
  binary_gripper_geometry_key: null
  binary_gripper_geometry_confidence_key: null
  # If the measured gripper is already closed, optionally use a dedicated
  # geometry-only hold/release classifier. Open-gripper grasp decisions remain
  # with the visual policy head, so this does not require stage supervision.
  binary_gripper_retention_state_key: null
  binary_gripper_retention_state_indices: []
  binary_gripper_retention_closed_threshold: 0.0
  binary_gripper_retention_current_only: false
  # Optionally decode hold/release only from SE(3)-invariant goal distance
  # (translation norm, rotation geodesic angle, confidence).
  binary_gripper_retention_invariant: false

  # Optional failure-matched adapter training. Nominal replay keeps the full
  # action loss; synthetic recovery rows supervise only the active-arm rotvec.
  recovery_rotation_only_loss: false
  recovery_rotation_loss_weight: 4.0

  # Optional SE(3)-factorized learned decoder. DP3 keeps generating translation;
  # this head replaces only the rotvec chunk of a currently closed arm.
  rotation_action_head_hidden_dim: 0
  rotation_action_head_loss_weight: 0.0
  rotation_action_head_recovery_weight: 1.0
  rotation_action_head_axis_aligned: false
  rotation_action_head_geometry_only: false
  rotation_action_head_gated: false
  # null preserves legacy behavior by matching rotation_action_head_geometry_only.
  # Set false with a geometry-only axis head when the gate must also inspect
  # encoded observation/proprioception context.
  rotation_action_gate_geometry_only: null
  rotation_action_gate_loss_weight: 0.0
  rotation_action_gate_positive_weight: 8.0
  rotation_action_gate_threshold: 0.5
  # Keep the factorized recovery head inside the rotation range represented by
  # its synthetic supervision. Defaults preserve the legacy unrestricted path.
  rotation_action_support_min_deg: 0.0
  rotation_action_support_max_deg: 180.0
  # Optional low-rotation translation-stall branch. A zero maximum disables it.
  # It shares the learned recovery gate but replaces translation only.
  translation_recovery_support_min_m: 0.0
  translation_recovery_support_max_m: 0.0
  translation_recovery_rotation_max_deg: 180.0
  # ``tagrt_global`` translation is divided by the dataset geometry scale.
  # Online deployment overwrites this with the checkpoint dataset contract.
  translation_recovery_geometry_scale_m: 1.0
  rotation_action_translation_head_hidden_dim: 0
  # Prefer this for object-disjoint recovery: it prevents visual/proprioceptive
  # shortcuts and decodes translation directly from the task-aligned SE(3) token.
  rotation_action_translation_geometry_only: false
  rotation_action_translation_current_only: false
  # Decode only world-frame remaining translation (plus confidence); rotation
  # is assigned to the separate task-aligned rotation decoder.
  rotation_action_translation_translation_only: false
  # Keep low-translation and high-rotation decoder duties orthogonal.
  rotation_action_translation_apply_on_high_rotation: false
  # Optional explicit [anchor-relative-left, anchor-relative-right, flow] tokens.
  rotation_action_translation_anchor_flow_key: null
  # Raw moment pooling with endpoint + zero-sum temporal residual decoding.
  rotation_action_translation_flow_consistent: false
  # Replace paired translation+rotation from one learned chunk so synthetic
  # joint-SE(3) labels and deployed active-arm actions obey the same contract.
  rotation_action_translation_joint_se3: false
  # Auxiliary consistency between six-step cumulative displacement and label.
  rotation_action_translation_endpoint_loss_weight: 0.0
  rotation_action_translation_loss_weight: 0.0
  rotation_action_head_geometry_key: null
  rotation_action_head_geometry_confidence_key: null

  pointcloud_encoder_cfg:
    in_channels: 3
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm
    normal_channel: false

ema:
  _target_: diffusion_policy_3d.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 256
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 256
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  checkpoint_dir: null
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 3000
  gradient_accumulate_every: 1
  use_ema: True
  # Partial fine-tuning deploys EMA weights. Align the raw training copy with
  # the checkpoint EMA first so frozen policy parameters remain bit-identical.
  partial_training_start_from_ema: true
  # Optional motion recovery fine-tuning that keeps both learned gripper heads
  # bit-identical to the deployed checkpoint.
  motion_only: false
  # Relearn closed-state hold/release while preserving the grasp head and all
  # Cartesian policy/recovery parameters bit-for-bit.
  binary_gripper_retention_head_only: false
  # Train only the task-aligned rotation decoder while preserving the deployed
  # DP3 translation, gripper, encoder, and TAGRT-adapter parameters bit-for-bit.
  rotation_action_head_only: false
  recovery_translation_head_only: false
  # Relearn only when the recovery decoder should run. This supports staged
  # training where an already validated SE(3) decoder remains bit-identical.
  rotation_action_gate_only: false
  rollout_every: 200
  checkpoint_every: 3000
  val_every: 50
  sample_every: 20
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  group: ${exp_name}
  id: null
  mode: online
  name: ${exp_name}
  project: RoboTwin
  resume: true
  tags:
  - RoboTwin
  - ObjPC

checkpoint:
  save_ckpt: False
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 1
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

checkpoint_num: 3000
expert_data_num: 100
raw_task_name: none
setting: none
