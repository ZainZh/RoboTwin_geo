name: ${task_name}-${setting}-${expert_data_num}

shape_meta: &shape_meta
  obs:
    point_cloud:
      shape: [128, 3]
      type: point_cloud
    point_cloud_B:
      shape: [128, 3]
      type: point_cloud
    agent_pos:
      shape: [20]
      type: low_dim
    tagrt_local:
      shape: [256, 4]
      type: point_cloud
    tagrt_global:
      shape: [9]
      type: low_dim
    tagrt_confidence:
      shape: [1]
      type: low_dim
  action:
    shape: [14]

env_runner:
  _target_: diffusion_policy_3d.env_runner.robot_runner.RobotRunner
  max_steps: 300
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  task_name: robot

dataset:
  _target_: diffusion_policy_3d.dataset.tagrt_dataset.TaskAlignedGeometryDataset
  npz_path: null
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  train_object_ids: [2, 3, 4, 7, 8, 9]
  val_object_ids: [1, 6]
  test_object_ids: [0, 5]
  split: train
  condition_mode: correct
  use_color: false
