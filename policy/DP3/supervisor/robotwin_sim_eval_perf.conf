[program:robotwin_sim_eval_perf]
command=/bin/bash /workspace/RoboTwin_geo_sim_v1/policy/DP3/scripts/benchmark_robotwin_sim_beat_fixed_eval.sh
directory=/workspace/RoboTwin_geo_sim_v1
autostart=true
autorestart=unexpected
startsecs=2
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/RoboTwin_geo_sim_v1/outputs/paper_revision/robotwin_sim_eval_perf_v1/stdout.log
stderr_logfile=/workspace/RoboTwin_geo_sim_v1/outputs/paper_revision/robotwin_sim_eval_perf_v1/stderr.log
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/workspace/RoboTwin_geo_sim_v1:/workspace/RoboTwin_geo_sim_v1/envs/curobo/src:/workspace/Utonia",TORCH_CUDA_ARCH_LIST="8.9",UTONIA_ROOT="/workspace/Utonia",TEST_NUM="1"
