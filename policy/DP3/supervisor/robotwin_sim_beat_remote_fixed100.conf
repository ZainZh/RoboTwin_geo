[program:robotwin_sim_beat_remote_fixed100]
command=/bin/bash /workspace/RoboTwin_geo_sim_v1/policy/DP3/scripts/run_robotwin_sim_beat_remote_fixed100.sh
directory=/workspace/RoboTwin_geo_sim_v1
autostart=true
autorestart=unexpected
startsecs=2
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/RoboTwin_geo_sim_v1/outputs/paper_revision/robotwin_sim_policy_beat_hammer_e300_bf16_v1/remote_fixed100.stdout.log
stderr_logfile=/workspace/RoboTwin_geo_sim_v1/outputs/paper_revision/robotwin_sim_policy_beat_hammer_e300_bf16_v1/remote_fixed100.stderr.log
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/workspace/Utonia",UTONIA_ROOT="/workspace/Utonia"
