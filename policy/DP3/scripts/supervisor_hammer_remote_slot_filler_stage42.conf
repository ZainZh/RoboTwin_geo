; PREPARED REPLACEMENT ONLY.  Do not install/reload until the four stage42
; task programs have been added with supervisor_hammer_stage42_remote_tasks.conf.
[program:hammer_slot_filler]
command=/workspace/venvs/geo-utonia/bin/python /workspace/RoboTwin_geo/policy/DP3/scripts/hammer_remote_slot_filler_stage42.py --max-active 4 --poll-seconds 30 --include-stage42 --event-log /workspace/RoboTwin_geo/outputs/paper_revision/hammer_remote_slot_filler.jsonl
directory=/workspace/RoboTwin_geo
autostart=true
autorestart=unexpected
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
